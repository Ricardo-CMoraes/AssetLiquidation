version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: asset_liquidation_db
    environment:
      POSTGRES_USER: root 
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: AssetLiquidationDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: